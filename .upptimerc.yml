# Change these first
owner: mbachmay # Your GitHub organization or username, where this repository lives
repo: EGeoSG-upptime # The name of this repository

sites:
  - name: DevViewer
    url: https://dev-map.geo.sg.ch/viewer/
    type: globalping
    location: switzerland
  # - name: Google
  #   url: https://www.google.com
  # - name: Wikipedia
  #   url: https://en.wikipedia.org
  # - name: Hacker News
  #   url: https://news.ycombinator.com
  # - name: Secret Site
  #   url: $SECRET_SITE

status-website:
  # Add your custom domain name, or remove the `cname` line if you don't have a domain
  # Uncomment the `baseUrl` line if you don't have a custom domain and add your repo name there
  # cname: demo.upptime.js.org
  baseUrl: /EGeoSG-upptime
  #### $OWNER und $REPO funktionieren hier nicht
  # logoUrl: https://raw.githubusercontent.com/$OWNER/$REPO/refs/heads/master/assets/EGeo_SG_hell.svg # URL wird nicht korrekt aufgelöst
  # logoUrl: https://mbachmay.github.io/EGeoSG-upptime/EGeo_SG_hell.svg # funktioniert
  logoUrl: https://raw.githubusercontent.com/mbachmay/EGeoSG-upptime/refs/heads/master/assets/EGeo_SG_hell.svg
  name: EGeoSG-Upptime
  introTitle: "**Checking** the dev viewer status."
  introMessage: Status page built using [Upptime](https://github.com/upptime/upptime). No server required — just GitHub Actions, Issues, and Pages. [**Get your own for free**](https://github.com/upptime/upptime)
  navbar:
    # - title: Status
    #   href: /
    - title: GitHub
      href: https://github.com/$OWNER/$REPO
    - title: Viewer
      href: https://dev-map.geo.sg.ch/viewer/
  themeUrl: https://mbachmay.github.io/EGeoSG-upptime/EGeoSG-theme.css
  # theme: dark
  faviconSvg: https://raw.githubusercontent.com/mbachmay/EGeoSG-upptime/refs/heads/master/assets/favicon_light.svg


